  <!-- This policy is the same one the real site will use. It blocks inline
       styles, inline scripts and anything from other websites. If something
       stops working and the browser console mentions "Content Security
       Policy", you have used one of those. Do not weaken the policy. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">

</head>

  <div id="site-footer"></div>

  <script type="module" src="/js/pages/home.js"></script>
</body>
</html>
